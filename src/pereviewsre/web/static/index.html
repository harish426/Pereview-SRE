<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI SRE investigator for Azure Application Insights traces">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>pereviewsre – Azure App Insights SRE</title>
<style>
  :root { --bg:#0b1020; --panel:#141b34; --line:#26305a; --fg:#e7ebff; --mut:#8f9bd1; --acc:#6c8cff; --acc2:#9b6cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, system-ui, sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #1b2457, var(--bg)); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  #app { flex:1; display:flex; min-height:0; }
  #side { width:260px; flex-shrink:0; border-right:1px solid var(--line); padding:12px; overflow:auto; display:flex; flex-direction:column; gap:6px; background:#0b102099; }
  #side h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:6px 6px 4px; }
  .ci { display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:10px; border:1px solid transparent; cursor:pointer; font-size:13px; color:var(--fg); }
  .ci:hover { background:#ffffff0d; }
  .ci.active { background:#6c8cff22; border-color:var(--acc); }
  .ci span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ci .del { background:none; border:0; padding:0 4px; color:var(--mut); border-radius:6px; }
  .ci .del:hover { color:#fff; background:#ffffff22; transform:none; }
  #pane { flex:1; min-width:0; display:flex; flex-direction:column; }
  @media (max-width:700px) { #side { width:150px; } }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; backdrop-filter: blur(8px); }
  header h1 { font-size:18px; margin:0; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; color:transparent; }
  header span { color:var(--mut); font-size:13px; }
  #chat { flex:1; overflow:auto; padding:24px; display:flex; flex-direction:column; gap:16px; max-width:960px; width:100%; margin:0 auto; }
  .msg { padding:14px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); white-space:pre-wrap; line-height:1.55; animation: in .25s ease; }
  .user { align-self:flex-end; background:linear-gradient(135deg,#2a3a86,#4b2f93); max-width:80%; }
  .steps { font-family: ui-monospace, monospace; font-size:12px; color:var(--mut); margin-bottom:10px; }
  form { display:flex; gap:10px; padding:16px 24px; border-top:1px solid var(--line); max-width:960px; width:100%; margin:0 auto; }
  input, button { font:inherit; border-radius:12px; border:1px solid var(--line); }
  input { flex:1; padding:14px; background:var(--panel); color:var(--fg); outline:none; }
  input:focus { border-color:var(--acc); box-shadow:0 0 0 3px #6c8cff33; }
  button { padding:0 22px; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; cursor:pointer; transition: transform .1s; }
  button:hover { transform: translateY(-1px); } button:disabled { opacity:.5; cursor:wait; }
  @keyframes in { from { opacity:0; transform:translateY(6px);} to {opacity:1;} }
  .msg.user, .msg.plain { white-space:pre-wrap; }
  .msg.bot { white-space:normal; }
  .md h2 { font-size:15px; margin:18px 0 8px; padding:6px 12px; border-left:3px solid var(--acc); background:#6c8cff14; border-radius:0 8px 8px 0; color:#fff; }
  .md h2:first-child { margin-top:0; }
  .md h1, .md h3, .md h4 { margin:14px 0 6px; color:var(--acc); }
  .md p { margin:6px 0; }
  .md ul, .md ol { margin:6px 0; padding-left:22px; }
  .md li { margin:3px 0; }
  .md code { font-family: ui-monospace, monospace; font-size:12.5px; background:#0b1020; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:#b9c6ff; }
  .md pre { background:#0b1020; border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; margin:8px 0; }
  .md pre code { border:0; padding:0; background:none; }
  .md table { border-collapse:collapse; width:100%; margin:8px 0; font-size:13px; display:block; overflow:auto; }
  .md th, .md td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  .md th { background:#1c2650; color:#fff; }
  .md tr:nth-child(even) td { background:#ffffff08; }
  .md strong { color:#fff; }
  details.steps summary { cursor:pointer; user-select:none; }
  details.steps div { white-space:pre-wrap; margin-top:6px; }
</style>
</head>
<body>
<header><h1>pereviewsre</h1><span>AI SRE · Azure Application Insights</span><button id="newchat" type="button" style="margin-left:auto;padding:8px 14px">New chat</button></header>
<div id="app">
<nav id="side" aria-label="Chats"><h2>Chats</h2><div id="list"></div></nav>
<div id="pane">
<main id="chat" aria-live="polite"></main>
<form id="form">
  <input id="q" autocomplete="off" placeholder="e.g. Why did checkout fail with 500s in the last hour?" required minlength="3">
  <button id="send" type="submit">Investigate</button>
</form>
</div>
</div>
<script>
const chat = document.getElementById('chat'), form = document.getElementById('form'),
      q = document.getElementById('q'), send = document.getElementById('send');
const token = sessionStorage.getItem('pereviewsre_token') || '';
// Chats live in page memory only (gone when the tab closes). Each chat has its own server session id,
// so reopening an old chat continues with its server-side memory (until idle TTL or tab close).
const chats = []; let cur = null;
const listEl = document.getElementById('list');
const authHeaders = () => (token ? {Authorization:'Bearer '+token} : {});
function endSession(id) {
  fetch('/api/session/' + id, { method:'DELETE', headers: authHeaders(), keepalive: true }).catch(() => {});
}
window.addEventListener('pagehide', () => chats.forEach(c => endSession(c.id)));
function renderList() {
  listEl.textContent = '';
  chats.forEach(c => {
    const row = document.createElement('div'); row.className = 'ci' + (c === cur ? ' active' : '');
    const t = document.createElement('span'); t.textContent = c.title; t.title = c.title;
    const x = document.createElement('button'); x.type = 'button'; x.className = 'del'; x.textContent = '×'; x.title = 'Delete chat';
    x.addEventListener('click', ev => { ev.stopPropagation(); removeChat(c); });
    row.append(t, x); row.addEventListener('click', () => openChat(c)); listEl.appendChild(row);
  });
}
function openChat(c) { cur = c; renderList(); renderChat(); send.disabled = c.busy; q.focus(); }
function newChat() {
  if (cur && !cur.items.length) { q.focus(); return; } // already on an empty chat
  const c = { id: crypto.randomUUID(), title: 'New chat', items: [], busy: false };
  chats.unshift(c); openChat(c);
}
function removeChat(c) {
  endSession(c.id); chats.splice(chats.indexOf(c), 1);
  if (c === cur) { chats.length ? openChat(chats[0]) : newChat(); } else renderList();
}
document.getElementById('newchat').addEventListener('click', newChat);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(s) { // input is already HTML-escaped
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}
function renderMarkdown(src) { // escape everything first, then add our own safe tags only
  const lines = esc(src).split('\n'); let out = '', i = 0;
  const cells = l => l.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++;
      out += '<pre><code>' + code.join('\n') + '</code></pre>'; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { const n = Math.max(2, h[1].length); out += '<h'+n+'>' + inline(h[2]) + '</h'+n+'>'; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i+1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])) {
      out += '<table><thead><tr>' + cells(l).map(c => '<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>'; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) out += '<tr>' + cells(lines[i++]).map(c => '<td>'+inline(c)+'</td>').join('') + '</tr>';
      out += '</tbody></table>'; continue; }
    const ul = /^\s*[-*]\s+/, ol = /^\s*\d+[.)]\s+/;
    if (ul.test(l) || ol.test(l)) { const re = ul.test(l) ? ul : ol, tag = re === ul ? 'ul' : 'ol'; out += '<'+tag+'>';
      while (i < lines.length && re.test(lines[i])) out += '<li>' + inline(lines[i++].replace(re,'')) + '</li>';
      out += '</'+tag+'>'; continue; }
    if (!l.trim()) { i++; continue; }
    let p = []; while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])) p.push(lines[i++]);
    if (!p.length) p.push(lines[i++]);
    out += '<p>' + inline(p.join('<br>')) + '</p>';
  }
  return out;
}
function buildMsg(it) {
  const d = document.createElement('div'); d.className = 'msg ' + (it.cls || (it.md ? 'bot' : 'plain'));
  if (it.steps && it.steps.length) {
    const calls = it.steps.filter(x => x.event === 'tool_call');
    if (calls.length) {
      const s = document.createElement('details'); s.className = 'steps';
      const sum = document.createElement('summary'); sum.textContent = 'Steps (' + calls.length + ' tool calls)';
      const body = document.createElement('div'); body.textContent = calls.map(x => '→ ' + x.name).join('\n');
      s.append(sum, body); d.appendChild(s);
    }
  }
  if (it.md) { const m = document.createElement('div'); m.className = 'md'; m.innerHTML = renderMarkdown(it.text); d.appendChild(m); }
  else d.appendChild(document.createTextNode(it.text)); // textContent only for user text
  return d;
}
function renderChat() {
  chat.textContent = '';
  cur.items.forEach(it => chat.appendChild(buildMsg(it)));
  chat.scrollTop = chat.scrollHeight;
}
function addItem(c, it) { c.items.push(it); if (c === cur) { chat.appendChild(buildMsg(it)); chat.scrollTop = chat.scrollHeight; } return it; }
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  const c = cur; if (c.busy) return;
  if (!c.items.length) { c.title = text.length > 40 ? text.slice(0, 40) + '…' : text; renderList(); }
  addItem(c, { text, cls: 'user' }); q.value = ''; c.busy = true; send.disabled = true;
  const pending = addItem(c, { text: 'Investigating…' });
  try {
    const r = await fetch('/api/ask', { method:'POST',
      headers: { 'Content-Type':'application/json', ...authHeaders() },
      body: JSON.stringify({ question: text, session_id: c.id }) });
    if (r.status === 401) { const t = prompt('Access token:'); if (t) sessionStorage.setItem('pereviewsre_token', t); throw new Error('Unauthorized – reload and retry'); }
    if (!r.ok) throw new Error('Request failed (' + r.status + ')');
    const data = await r.json(); Object.assign(pending, { text: data.answer, steps: data.steps, md: true });
  } catch (err) { pending.text = 'Error: ' + err.message; }
  finally { c.busy = false; if (c === cur) { renderChat(); send.disabled = false; q.focus(); } }
});
newChat();
</script>
</body>
</html>
